name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: yarn install

      - name: Build project
        run: yarn build

      - name: Decrypt TVBox configs to mirror
        run: python3 mirror/decrypt.py mirror/lines.txt dist/mirror "https://kukuqi666.github.io/Tvbox-decrypt/mirror"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
